# Конфіг Supabase CLI — потрібен лише для деплою Edge Functions
# (`supabase functions deploy <name>`). Міграції й далі застосовуються
# вручну через Dashboard → SQL Editor, як і раніше.
project_id = "finance-app"

[functions.crypto-binance-keys]
verify_jwt = true

[functions.crypto-binance-sync]
verify_jwt = true

[functions.stock-price-sync]
verify_jwt = true

# Викликається pg_cron (013_recurring_payments.sql), не залогіненим
# користувачем — user JWT тут нема, авторизація через власний CRON_SECRET
# у заголовку Authorization (перевіряється всередині функції).
[functions.recurring-payments-cron]
verify_jwt = false
